services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techhub_app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=techhub_db
      - DB_USER=techhub_user
      - DB_PASS=secret123
    volumes:
      - app_data:/var/www/html/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: techhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: techhub_db
      MYSQL_USER: techhub_user
      MYSQL_PASSWORD: secret123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  db_data:
